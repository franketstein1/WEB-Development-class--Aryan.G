<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 4 - Video Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section>
    <div style="position: relative; width: 640px; margin: 0 auto;">
        <video id="myVideo" width="640" height="360" poster="" controls>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div id="playButton" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
            <svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                <circle cx="40" cy="40" r="35" fill="#000" fill-opacity="0.7" stroke="#fff" stroke-width="3"/>
                <polygon points="28,20 28,60 60,40" fill="#fff"/>
            </svg>
        </div>
    </div>
</section>
</body>
</html>
