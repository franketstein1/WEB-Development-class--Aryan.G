<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card Assignment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="heading-area">
    <h1>Famous Personality</h1>
    <p class="subtitle">
      A short profile highlighting achievements and background.
    </p>
  </section>

  <section class="profile-card">
    <img src="person.jpg" alt="Profile Image">

    <div class="profile-content">
      <h2>Elon Musk</h2>
      <p>
        Elon Musk is a technology entrepreneur known for his work in
        electric vehicles, space exploration, and innovative startups.
      </p>
    </div>
  </section>

</body>
</html>
